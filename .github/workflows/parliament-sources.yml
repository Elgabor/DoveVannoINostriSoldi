name: Parliamentary source monitor

on:
  push:
    branches: [main]
    paths:
      - scripts/etl/parliament_sources.py
      - src/lib/data/parliament-contract.ts
      - src/data/generated/parliament-overview.json
      - src/data/generated/parliament-source-manifest.json
      - tests/parliament-contract.test.mjs
      - tests/etl/test_parliament_sources.py
      - tests/fixtures/parliament/**
      - .github/workflows/parliament-sources.yml
  pull_request:
    paths:
      - scripts/etl/parliament_sources.py
      - src/lib/data/parliament-contract.ts
      - src/data/generated/parliament-overview.json
      - src/data/generated/parliament-source-manifest.json
      - tests/parliament-contract.test.mjs
      - tests/etl/test_parliament_sources.py
      - tests/fixtures/parliament/**
      - .github/workflows/parliament-sources.yml
  schedule:
    - cron: "37 */6 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: parliament-sources-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Test offline parsers
        run: python -m unittest tests/etl/test_parliament_sources.py
      - name: Validate committed data offline
        run: python scripts/etl/parliament_sources.py --check
      - name: Check official document registers
        if: github.event_name != 'pull_request'
        run: python scripts/etl/parliament_sources.py
